name: Deploy to Local Raspbi via cloudflare tunnel

on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      #install cloudflare warp client
      - name: Setup Cloudflare WARP Action
        uses: oHTGo/setup-cloudflare-warp-action@v0.3.1
        with:
          organization: your-organization
          auth_client_id: ${{ secrets.AUTH_CLIENT_ID }}
          auth_client_secret: ${{ secrets.AUTH_CLIENT_SECRET }}

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Test SSH Connection
        run: ssh ${{ secrets.USERNAME }}@${{ secrets.SSH_HOST }} "echo 'SSH Verbindung erfolgreich'"
