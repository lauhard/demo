name: Deploy to Local Raspbi via cloudflare tunnel

on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Action-SSH
        uses: tiyee/action-ssh@v1.0.1
        with:
          host: alau.at
          port: 22
          username: andreas
          privateKey: ${{ secrets.VPS_PRIVATE_KEY }}
          command: |
            cd /var/www/html
            git pull
            npm install
            npm run build
            pm2 restart all
